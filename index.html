<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
        <h2 class="text-2xl font-bold text-center text-white mb-2">স্কুল স্টুডেন্ট ডিরেক্টরি</h2>
        <p class="text-slate-400 text-xs text-center mb-6">আপনার তথ্য দিয়ে রিইউনিয়ন ডিরেক্টরি পূর্ণ করুন</p>

        <form id="studentForm" onsubmit="submitToGitHub(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">পূর্ণ নাম *</label>
                <input type="text" id="name" required placeholder="আপনার নাম" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">ব্যাচ / পাসের বছর *</label>
                <input type="text" id="batch" required placeholder="যেমন: SSC 2020" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">মোবাইল নম্বর *</label>
                <input type="tel" id="phone" required placeholder="017XXXXXXXX" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">ঠিকানা *</label>
                <textarea id="address" required placeholder="আপনার ঠিকানা" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500"></textarea>
            </div>

            <button type="submit" id="btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition">
                তথ্য জমা দিন
            </button>
        </form>

        <div id="msg" class="hidden text-center text-emerald-400 font-semibold mt-4">
            ধন্যবাদ! আপনার তথ্য সফলভাবে জমা হয়েছে।
        </div>
    </div>

    <script>
        // এখানে আপনার তথ্য বসিয়ে দিন:
        const GITHUB_USERNAME = "YOUR_GITHUB_USERNAME"; // আপনার GitHub ইউজারনেম
        const REPO_NAME = "YOUR_REPO_NAME";             // আপনার Repo-র নাম
        const GITHUB_TOKEN = "YOUR_PERSONAL_ACCESS_TOKEN"; // ধাপ ১-এ কপি করা টোকেনটি

        function submitToGitHub(e) {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.innerText = "জমা হচ্ছে...";
            btn.disabled = true;

            const name = document.getElementById('name').value;
            const batch = document.getElementById('batch').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;

            const issueTitle = `Entry: ${name} (${batch})`;
            const issueBody = `**Name:** ${name}\n**Batch:** ${batch}\n**Phone:** ${phone}\n**Address:** ${address}`;

            fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/issues`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    title: issueTitle,
                    body: issueBody
                })
            })
            .then(res => {
                if(res.ok) {
                    document.getElementById('studentForm').classList.add('hidden');
                    document.getElementById('msg').classList.remove('hidden');
                } else {
                    alert('কোথাও সমস্যা হয়েছে! সেটিংস ঠিক আছে কিনা চেক করুন।');
                    btn.disabled = false;
                    btn.innerText = "তথ্য জমা দিন";
                }
            })
            .catch(() => {
                alert('ভুল হয়েছে!');
                btn.disabled = false;
                btn.innerText = "তথ্য জমা দিন";
            });
        }
    </script>
</body>
</html>
